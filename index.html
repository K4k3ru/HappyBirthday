<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9f6;--ink:#34104f;--muted:#6b4a85;--panel:#fff;--pink:#ff3d8b;--yellow:#ffc933;--c1:#ff3d8b;--c2:#6a3df0;--c3:#f06a00;--c4:#0f9d8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0b3a;--ink:#fff2fb;--muted:#cdb3e8;--panel:#2c1456;--c2:#a58bff;--c3:#ff9a3d;--c4:#37d6bf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d0b3a;--ink:#fff2fb;--muted:#cdb3e8;--panel:#2c1456;--c2:#a58bff;--c3:#ff9a3d;--c4:#37d6bf;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:600 1.05rem/1.6 Nunito,system-ui,sans-serif;overflow-x:hidden}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#bl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bl i{position:absolute;bottom:-160px;border-radius:50% 50% 48% 48%;opacity:.9;animation:rise linear infinite;box-shadow:inset -7px -9px 0 rgba(0,0,0,.14),inset 8px 8px 0 rgba(255,255,255,.28)}
#bl i::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:var(--muted);opacity:.6}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(18px,-32vh)}50%{transform:translate(-14px,-64vh)}75%{transform:translate(16px,-96vh)}100%{transform:translate(0,-135vh)}}
main{position:relative;z-index:2;width:100%;max-width:none;margin:0 auto;padding:12px clamp(16px,3vw,48px);text-align:center}
.gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.gift{font-size:5rem;line-height:1;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
h1,h2{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;margin:0;line-height:1.05}
.gate h1{font-size:clamp(2.2rem,8vw,3.4rem)}
input[type=text]{width:min(100%,340px);padding:14px 18px;border-radius:999px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);font:inherit;text-align:center}
.btn{font:800 1rem Nunito,system-ui,sans-serif;color:#2a0f3d;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--pink);color:#fff}
:focus-visible{outline:3px solid var(--c2);outline-offset:3px}
.t{font-size:clamp(2.6rem,12vw,5.4rem);margin-top:8px}
.t span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
.t span:nth-child(4n+1){color:var(--c1)}.t span:nth-child(4n+2){color:var(--c2)}.t span:nth-child(4n+3){color:var(--c3)}.t span:nth-child(4n){color:var(--c4)}
@keyframes wave{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-5deg)}}
#who{display:block;font-size:clamp(2rem,5.5vw,4.2rem);color:var(--ink);margin-top:6px;animation:pop .8s .9s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#cake{width:min(280px,48vw);margin:12px auto 0;display:block;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate;transition:opacity .4s}
.fl:nth-of-type(2){animation-delay:.15s}.fl:nth-of-type(3){animation-delay:.3s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.82,1.14) rotate(3deg)}}
.out .fl{opacity:0}
#wish{min-height:1.6em;margin:6px 0 14px;color:var(--muted);font-weight:800}
.party-layout{min-height:calc(100vh - 24px);display:grid;grid-template-columns:minmax(380px,1fr) minmax(0,1.35fr);align-items:center;gap:clamp(32px,5vw,90px)}
.celebration{display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage{margin:0 auto;max-width:820px;width:100%}
.stage h2{font-size:clamp(1.7rem,5vw,2.5rem);margin-bottom:16px}
.frame{background:var(--panel);border:5px solid var(--ink);border-radius:22px;box-shadow:9px 9px 0 var(--pink);transform:rotate(-1.2deg);padding:10px;transition:transform .3s}
.frame:hover{transform:rotate(0)}
video{display:block;width:100%;max-height:62vh;border-radius:12px;background:#000}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px;border:3px dashed var(--muted);border-radius:12px;cursor:pointer;padding:20px;color:var(--muted)}
.drop b{font:400 1.5rem "Bagel Fat One",system-ui,sans-serif;color:var(--ink)}
.drop span.big{font-size:3rem;line-height:1}
.drop.over{border-color:var(--pink);color:var(--pink)}
#err{color:var(--pink);font-weight:800;margin:10px 0 0}
#msg{max-width:30em;margin:20px auto 0;font-size:1.2rem;outline:none}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
footer{margin-top:24px;color:var(--muted);font-size:.9rem}
@media (max-width:760px){main{padding:20px}.party-layout{min-height:auto;grid-template-columns:1fr;gap:24px}.celebration{padding-top:12px}.t{font-size:clamp(2.6rem,12vw,5.4rem)}#cake{width:min(230px,60vw)}video{max-height:55vh}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bl" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <section id="gate" class="gate">
    <div class="gift" aria-hidden="true">🎁</div>
    <h1>Let’s celebrate Mariane!</h1>
    
    <button id="go" class="btn alt">Open the surprise</button>
  </section>

  <section id="party" class="party-layout" hidden>
    <div class="celebration">
      <h1 class="t" id="title" aria-label="Happy Birthday"></h1>
      <span id="who" class="t" style="font-family:'Bagel Fat One',system-ui,sans-serif"></span>

      <svg id="cake" viewBox="0 0 220 190" role="img" aria-label="Birthday cake with three candles">
      <ellipse cx="110" cy="178" rx="104" ry="9" fill="#000" opacity=".15"/>
      <rect x="20" y="112" width="180" height="62" rx="12" fill="#ff8fc2"/>
      <rect x="45" y="72" width="130" height="46" rx="10" fill="#ff6fa8"/>
      <path d="M20 130q15 14 30 0t30 0t30 0t30 0t30 0t30 0v-8H20z" fill="#fff"/>
      <path d="M45 88q13 12 26 0t26 0t26 0t26 0t26 0v-8H45z" fill="#fff"/>
      <circle cx="60" cy="152" r="5" fill="#ffc933"/><circle cx="110" cy="158" r="5" fill="#6a3df0"/><circle cx="160" cy="152" r="5" fill="#0f9d8a"/>
      <g fill="#ffc933" stroke="#34104f" stroke-width="2"><rect x="80" y="46" width="8" height="28" rx="2"/><rect x="106" y="46" width="8" height="28" rx="2"/><rect x="132" y="46" width="8" height="28" rx="2"/></g>
      <ellipse class="fl" cx="84" cy="36" rx="5.5" ry="10" fill="#ff9d00"/>
      <ellipse class="fl" cx="110" cy="36" rx="5.5" ry="10" fill="#ff9d00"/>
      <ellipse class="fl" cx="136" cy="36" rx="5.5" ry="10" fill="#ff9d00"/>
      </svg>
      <p id="wish" aria-live="polite">Make a wish, then blow out the candles.</p>
      <div class="row" style="margin-top:0">
        <button id="blow" class="btn alt">Blow out the candles 💨</button>
      </div>
    </div>

    <div>
      <div class="stage">
      <h2>A special video for you</h2>
      <div class="frame" id="frame">
        <video id="vid" controls loop playsinline preload="auto" src="./Happy%20Birthday!.mp4"></video>
        <label class="drop" id="drop" hidden>
          <span class="big">🎬</span>
          <b>Add your video</b>
          <span>Choose a video from your device, or drop it here.</span>
          <input id="pick" type="file" accept="video/*" hidden>
        </label>
      </div>
      <p id="err" hidden>This video couldn’t play here. Try an MP4 file.</p>
      </div>

      <p id="msg" contenteditable="true" spellcheck="false">Wishing you a day full of love, laughter, and all your favorite things. Happy birthday!</p>
    </div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const COL=['#ff3d8b','#ffc933','#6a3df0','#0f9d8a','#ff7a1a','#3d9bff'];
const cv=$('fx'),cx=cv.getContext('2d');
let P=[],run=false,W=0,H=0;
function size(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();

function spawn(p){P.push(Object.assign({w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4},p));
  if(!run){run=true;requestAnimationFrame(tick)}}
function burst(x,y,n=90){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
  spawn({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,c:COL[i%COL.length]})}}
function rain(n=110){for(let i=0;i<n;i++)spawn({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:1+Math.random()*2,c:COL[i%COL.length]})}
function tick(){
  cx.clearRect(0,0,W,H);
  P=P.filter(p=>p.y<H+30);
  for(const p of P){p.vy=Math.min(p.vy+.18,5);p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,W,H)}
}

function balloons(){
  const b=$('bl');
  for(let i=0;i<14;i++){
    const e=document.createElement('i'),s=44+Math.random()*34;
    e.style.cssText='left:'+(Math.random()*96)+'%;width:'+s+'px;height:'+(s*1.2)+'px;background:'+COL[i%COL.length]+';animation-duration:'+(10+Math.random()*10)+'s;animation-delay:-'+(Math.random()*14)+'s';
    b.appendChild(e);
  }
}

function start(){
  const n='Mariane';
  $('gate').hidden=true;$('party').hidden=false;
  const t=$('title');t.textContent='';
  'Happy Birthday'.split('').forEach((c,i)=>{
    const s=document.createElement('span');
    s.textContent=c===' '?'\u00a0':c;
    s.style.animationDelay=(i*.08)+'s';
    t.appendChild(s);
  });
  $('who').textContent=n?n+'!':'to you!';
  document.title=n?'Happy Birthday, '+n+'!':'Happy Birthday!';
  balloons();
  burst(W/2,H/3,160);rain();
  setInterval(()=>{if(!document.hidden){burst(W*(.15+Math.random()*.7),H*(.25+Math.random()*.3),90);rain(50)}},5000);
  const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{})});
  scrollTo(0,0);
}
$('go').onclick=start;


let out=false;
$('blow').onclick=function(){
  out=!out;
  $('cake').classList.toggle('out',out);
  this.textContent=out?'Relight the candles 🔥':'Blow out the candles 💨';
  $('wish').textContent=out?'Your wish is on its way. ✨':'Make a wish, then blow out the candles.';
  if(out){burst(W/2,H/2,140);rain(60)}
};




const v=$('vid'),drop=$('drop');
function load(f){
  try{
    if(!f||!/^video\//.test(f.type))return;
    $('err').hidden=true;
    v.src=URL.createObjectURL(f);
    v.hidden=false;drop.hidden=true;
    const p=v.play();if(p&&p.catch)p.catch(()=>{});
    burst(W/2,H/2,80);
  }catch(e){$('err').hidden=false}
}
v.onerror=()=>{$('err').hidden=false;v.hidden=true;drop.hidden=false};
$('pick').onchange=e=>load(e.target.files[0]);
['dragenter','dragover'].forEach(n=>$('frame').addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(n=>$('frame').addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
$('frame').addEventListener('drop',e=>load(e.dataTransfer.files[0]));
</script>
</body>
</html>
